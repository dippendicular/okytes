[package]
name = "okytes-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
okytes-core.workspace = true
okytes-persistence.workspace = true
okytes-desktop-service = { version = "=0.1.0", path = "../desktop/service" }
okytes-daemon-api = { version = "=0.1.0", path = "../../crates/daemon-api" }
okytes-browser-bridge = { version = "=0.1.0", path = "../../crates/browser-bridge" }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
hyper-util.workspace = true
utoipa.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
sha2.workspace = true
subtle = "2"
rand.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = "0.14"
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
okytes-test-support.workspace = true
