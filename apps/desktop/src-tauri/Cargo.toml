[package]
name = "okytes-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
okytes-core.workspace = true
okytes-torrent-types.workspace = true
okytes-desktop-service = { version = "=0.1.0", path = "../service" }
okytes-daemon-api = { version = "=0.1.0", path = "../../../crates/daemon-api" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
okytes-browser-bridge = { version = "=0.1.0", path = "../../../crates/browser-bridge" }

