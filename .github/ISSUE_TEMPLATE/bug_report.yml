name: Bug report
description: Report a reproducible problem without private URLs or credentials.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Okytes version, OS and architecture
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove credentials, tokens and private URLs. Report vulnerabilities privately.
