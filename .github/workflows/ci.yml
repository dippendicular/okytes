name: Product checks
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux desktop libraries
        # vendor stays private/ignored; reconstruct the reviewed patch set.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare patched torrent dependencies
        run: node scripts/prepare-vendor.mjs
      - name: Check generated bindings
        run: |
          cargo test -p okytes-core --lib --locked desktop::export_bindings
          cargo test -p okytes-core --lib --locked traffic::export_bindings
          cargo test -p okytes-torrent-types --lib --locked
          node apps/desktop/scripts/normalize-bindings.mjs
          git diff --exit-code -- crates/core/bindings crates/torrent-types/bindings
      - name: Frontend checks
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: Check browser protocol bindings
        run: |
          cargo test -p okytes-browser-bridge --lib --locked protocol::export_bindings
          git diff --exit-code -- extensions/shared/generated
      - name: Browser extension checks
        working-directory: extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - run: cargo fmt --all -- --check
      - name: Daemon contract and SDK checks
        run: |
          cargo test -p okytes-daemon --test contract --locked
          pnpm --dir packages/sdk-typescript install --frozen-lockfile
          pnpm --dir packages/sdk-typescript generate
          git diff --exit-code -- packages/sdk-typescript/src/schema.ts
          pnpm --dir packages/sdk-typescript typecheck
          pnpm --dir packages/sdk-typescript build
          pnpm --dir packages/sdk-typescript test
          cargo test -p okytes-daemon --test sdk --locked -- --ignored
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prepare-vendor.mjs
      - run: cargo test -p okytes-cli --test process --release --locked -- --ignored --nocapture
