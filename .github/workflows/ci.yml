name: Product checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            extensions/pnpm-lock.yaml
            dev-tools/sdk/packages/sdk-typescript/pnpm-lock.yaml
      - name: Linux desktop libraries
        # vendor stays private/ignored; reconstruct the reviewed patch set.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare patched torrent dependencies
        run: node dev-tools/scripts/prepare-vendor.mjs
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded Quick Download assets
        run: |
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop build:quick
      - name: Packaging regression tests
        if: runner.os == 'Linux'
        run: node --test dev-tools/test-suite/packaging/tests/release.test.mjs
      - name: Check generated bindings
        if: runner.os == 'Linux'
        run: |
          cargo test -p okytes-core --lib --locked desktop::export_bindings
          cargo test -p okytes-core --lib --locked traffic::export_bindings
          cargo test -p okytes-torrent-types --lib --locked
          node apps/desktop/scripts/normalize-bindings.mjs
          git diff --exit-code -- crates/core/bindings crates/torrent-types/bindings
      - name: Frontend checks
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: Check browser protocol bindings
        if: runner.os == 'Linux'
        run: |
          cargo test -p okytes-browser-bridge --lib --locked protocol::export_bindings
          git diff --exit-code -- extensions/shared/generated
      - name: Browser extension checks
        if: runner.os == 'Linux'
        working-directory: extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - name: Daemon contract and SDK checks
        if: runner.os == 'Linux'
        run: |
          cargo test -p okytes-daemon --test contract --locked
          pnpm --dir dev-tools/sdk/packages/sdk-typescript install --frozen-lockfile
          pnpm --dir dev-tools/sdk/packages/sdk-typescript generate
          git diff --exit-code -- dev-tools/sdk/packages/sdk-typescript/src/schema.ts
          pnpm --dir dev-tools/sdk/packages/sdk-typescript typecheck
          pnpm --dir dev-tools/sdk/packages/sdk-typescript build
          pnpm --dir dev-tools/sdk/packages/sdk-typescript test
          cargo test -p okytes-daemon --test sdk --locked -- --ignored
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: runner.os == 'Linux'
  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            extensions/pnpm-lock.yaml
            dev-tools/sdk/packages/sdk-typescript/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          key: stress
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - run: pnpm --dir apps/desktop build:quick
      - run: node dev-tools/scripts/prepare-vendor.mjs
      - run: cargo test -p okytes-cli --test process --release --locked -- --ignored --nocapture
  workflows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
  quick-browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            extensions/pnpm-lock.yaml
            dev-tools/sdk/packages/sdk-typescript/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          key: quick-browser
      - run: node dev-tools/scripts/prepare-vendor.mjs
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - run: pnpm --dir apps/desktop build:quick
      - run: cargo build --locked -p okytes-test-support --example desktop_fixture
      - run: cargo build --locked -p okytes-daemon -p okytes-cli
      - run: pnpm --dir apps/desktop exec playwright install chromium firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
      - run: pnpm --dir apps/desktop test:quick
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
          OKYTES_QUICK_BROWSERS: chromium,firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-browser-evidence
          path: .tools/m9-browser/**/report.json
