[package]
name = "okytes-browser-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
uuid.workspace = true
url.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true
