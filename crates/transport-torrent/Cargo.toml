[package]
name = "okytes-transport-torrent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
okytes-core.workspace = true
okytes-persistence.workspace = true
okytes-torrent-types.workspace = true
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "=9.0.1", default-features = false, features = ["sha1-ring"] }
tokio.workspace = true
tokio-util = "0.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
base64 = "0.22"
sha2.workspace = true
futures.workspace = true
tracing.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
anyhow.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
tempfile.workspace = true
