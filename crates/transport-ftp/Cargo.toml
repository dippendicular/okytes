[package]
name = "okytes-transport-ftp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Validated FTP, explicit FTPS and SFTP transport"

[dependencies]
okytes-core.workspace = true
suppaftp = { version = "=12.1.0", default-features = false, features = ["tokio-rustls-ring", "no-log"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.1"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes.workspace = true
futures.workspace = true
url.workspace = true
percent-encoding = "2"
async-stream = "0.3"

[dev-dependencies]
okytes-test-support.workspace = true
okytes-persistence.workspace = true
tempfile.workspace = true
rand = "0.10"
sha2.workspace = true
rcgen = "0.14"
