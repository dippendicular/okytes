<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Okytes</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="brand"><img src="brand/okytes_logo_transperant.png" alt="Okytes" /></div>
    <p id="status" role="status">Checking desktop connection…</p>
    <label for="urls">Download links</label
    ><textarea id="urls" rows="6" placeholder="One link per line"></textarea>
    <button id="send">Send to Okytes</button
    ><button id="collect">Collect page links</button>
    <button id="media">Detect media manifests</button
    ><button id="settings">Settings</button>
    <p>
      Review detected manifests before sending. Okytes supports VOD and refuses DRM and unsupported formats.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
