[advisories]
version = 2
# Informational maintenance advisory, not a reported vulnerability. Tauri 2's
# Linux GTK3 proc macros require this crate; no patched version exists. Review
# with the next Tauri update and by 2027-01-14. See ADR 0006.
ignore = ["RUSTSEC-2024-0370"]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
